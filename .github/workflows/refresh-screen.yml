name: Weekly refresh

# Two jobs that must happen in order, once a week:
#   1. precompute the Market Screener so visitors read a cached result instead
#      of triggering a minutes-long on-demand run;
#   2. rebuild the simulated Strong-Buy portfolios, which read the screener's
#      snapshot history — so they must run after it, not before.
#
# Both talk to the deployed app over HTTP with the same shared secret, so this
# workflow never needs a database credential.

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      indices:
        description: "Comma-separated indices to refresh (blank = all)"
        required: false
        default: ""
      skip_screener:
        description: "Skip the screener and only rebuild the portfolio"
        required: false
        default: "false"
      backup_only:
        description: "Only take the database backup (skip everything else)"
        required: false
        default: "false"

# Never run two refreshes at once.
concurrency:
  group: refresh-screener
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Refresh screens
        if: ${{ github.event.inputs.skip_screener != 'true' && github.event.inputs.backup_only != 'true' }}
        env:
          SCREEN_RUN_URL: ${{ secrets.SCREEN_RUN_URL }}
          SCREEN_RUN_TOKEN: ${{ secrets.SCREEN_RUN_TOKEN }}
          SCREEN_INDICES: ${{ github.event.inputs.indices }}
        run: node scripts/refresh-screen.mjs

      # Grades every past rating by what happened next; reads the same snapshots.
      - name: Rebuild rating scorecard
        if: ${{ !cancelled() && github.event.inputs.backup_only != 'true' }}
        env:
          SCREEN_RUN_URL: ${{ secrets.SCREEN_RUN_URL }}
          SCREEN_RUN_TOKEN: ${{ secrets.SCREEN_RUN_TOKEN }}
        run: |
          set -euo pipefail
          URL="${SCREEN_RUN_URL%/api/screen/run}/api/scorecard/build"
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 120 -o /tmp/scorecard.json -w '%{http_code}' \
              -X POST -H "x-screen-token: ${SCREEN_RUN_TOKEN}" "${URL}" || echo 000)
            cat /tmp/scorecard.json 2>/dev/null; echo
            if [ "$code" = "200" ]; then exit 0; fi
            echo "Attempt ${attempt}: scorecard build failed with HTTP ${code}"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1

      # Reads the snapshot history the refresh extended, and the index averages
      # the scorecard just saved (for each book's return split).
      - name: Rebuild simulated portfolios
        if: ${{ !cancelled() && github.event.inputs.backup_only != 'true' }}
        env:
          SCREEN_RUN_URL: ${{ secrets.SCREEN_RUN_URL }}
          SCREEN_RUN_TOKEN: ${{ secrets.SCREEN_RUN_TOKEN }}
        run: |
          set -euo pipefail
          # SCREEN_RUN_URL is the full screener endpoint; derive the sibling one.
          BUILD_URL="${SCREEN_RUN_URL%/api/screen/run}/api/portfolio/build"
          echo "POST ${BUILD_URL}"
          # 503 = prices still downloading (resumed from the cache next call) or
          # Yahoo throttling after the screener's long walk; nothing is saved
          # until every history is in, so wait and call again.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 120 -o /tmp/portfolio.json -w '%{http_code}' \
              -X POST -H "x-screen-token: ${SCREEN_RUN_TOKEN}" "${BUILD_URL}" || echo 000)
            cat /tmp/portfolio.json 2>/dev/null; echo
            if [ "$code" = "200" ]; then exit 0; fi
            echo "Attempt ${attempt}: portfolio build failed with HTTP ${code}"
            if [ "$code" = "401" ]; then exit 1; fi
            [ "$attempt" -lt 6 ] && sleep 180
          done
          exit 1

      # The weekly ratings, frozen reports and saved analyses cannot be rebuilt,
      # so keep an encrypted copy outside the database. The repository is
      # public, so the file is encrypted with SCREEN_RUN_TOKEN; restore steps
      # are at the top of scripts/restore-db.mjs. Each copy is kept 90 days.
      - name: Back up the database
        if: ${{ !cancelled() }}
        env:
          SCREEN_RUN_URL: ${{ secrets.SCREEN_RUN_URL }}
          SCREEN_RUN_TOKEN: ${{ secrets.SCREEN_RUN_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/backup-db.mjs backup
          tar czf - backup | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:SCREEN_RUN_TOKEN -out backup.tar.gz.enc
          ls -l backup.tar.gz.enc

      - name: Keep the backup
        if: ${{ !cancelled() && hashFiles('backup.tar.gz.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backup.tar.gz.enc
          retention-days: 90
          if-no-files-found: error
